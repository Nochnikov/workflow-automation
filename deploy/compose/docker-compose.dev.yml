x-configs: &common_configs
  env_file:
    - ../env/.env

services:
  db:
    <<: *common_configs
    image: postgres:17-alpine
    container_name: my_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-migration:
    <<: *common_configs
    build:
      context: ../..
      dockerfile: deploy/dockerfile/Dockerfile
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
